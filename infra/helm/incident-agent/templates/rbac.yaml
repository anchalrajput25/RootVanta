apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ia.fullname" . }}
  labels: {{- include "ia.labels" . | nindent 4 }}
automountServiceAccountToken: {{ gt (len .Values.scaling.namespaces) 0 }}
{{- range $ns := .Values.scaling.namespaces }}
---
# Lets the agent read and change replica counts in {{ $ns }}, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ia.fullname" $ }}-scale
  namespace: {{ $ns }}
  labels: {{- include "ia.labels" $ | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ia.fullname" $ }}-scale
  namespace: {{ $ns }}
  labels: {{- include "ia.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "ia.fullname" $ }}-scale}
subjects:
  - kind: ServiceAccount
    name: {{ include "ia.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
