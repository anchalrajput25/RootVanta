apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ia.fullname" . }}-worker
  labels: {{- include "ia.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "ia.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ia.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ia.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # A worker finishes the job it is on before stopping; fixes are watched for several minutes.
      terminationGracePeriodSeconds: 900
      {{- include "ia.podExtras" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ .Values.image.api }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "incident_agent.workflow"]
          env:
            {{- include "ia.env" . | nindent 12 }}
            - name: INCIDENT_AGENT_RUNBOOK
              value: /app/demo/runbook.yaml
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
