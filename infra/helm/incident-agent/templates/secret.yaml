{{- /*
Keys: database-url, jwt-secret, secret-key, anthropic-api-key, and with the built-in
database postgres-password and app-db-password. Random values are made on first
install and read back from the cluster on upgrades, so they never change by accident.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- if and (not .Values.postgres.enabled) (not .Values.externalDatabase.url) }}
{{- fail "Set externalDatabase.url, or postgres.enabled=true to run a database in the cluster" }}
{{- end }}
{{- $name := include "ia.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $keep := dict }}
{{- range $k := list "jwt-secret" "secret-key" "postgres-password" "app-db-password" }}
{{- $_ := set $keep $k (index $old $k | default "" | b64dec | default (randAlphaNum 48)) }}
{{- end }}
{{- $dbUrl := .Values.externalDatabase.url }}
{{- if not $dbUrl }}
{{- $dbUrl = printf "postgresql+psycopg://incident_app:%s@%s-postgres:5432/incident_agent" (index $keep "app-db-password") (include "ia.fullname" .) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ia.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ $dbUrl | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | default (index $keep "jwt-secret") | quote }}
  secret-key: {{ .Values.secrets.secretKey | default (index $keep "secret-key") | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ index $keep "postgres-password" | quote }}
  app-db-password: {{ index $keep "app-db-password" | quote }}
  {{- end }}
{{- end }}
