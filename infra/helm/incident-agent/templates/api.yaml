apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ia.fullname" . }}-api
  labels: {{- include "ia.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "ia.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ia.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ia.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "ia.podExtras" . | nindent 6 }}
      containers:
        - name: api
          image: {{ .Values.image.api }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "incident_agent.api.app:create_app", "--factory", "--host", "0.0.0.0",
                    "--port", "8000", "--workers", {{ .Values.api.processes | quote }}, "--proxy-headers"]
          env: {{- include "ia.env" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ia.fullname" . }}-api
  labels: {{- include "ia.labels" . | nindent 4 }}
spec:
  selector: {{- include "ia.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - {name: http, port: 8000, targetPort: http}
