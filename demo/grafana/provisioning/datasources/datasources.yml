apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace
          matcherRegex: '"trace_id": "(\w+)"'
          url: "$${__value.raw}"
          datasourceUid: jaeger
  - name: Jaeger
    uid: jaeger
    type: jaeger
    url: http://jaeger:16686
